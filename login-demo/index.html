<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.22), transparent 34%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.12), transparent 30%),
        linear-gradient(135deg, #5f6368 0%, #8b9096 48%, #4b4f54 100%);
      color: #f8fafc;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      width: min(92vw, 380px);
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 20px;
      padding: 28px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(22px) saturate(130%);
      -webkit-backdrop-filter: blur(22px) saturate(130%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      color: #ffffff;
    }

    p {
      margin: 0 0 22px;
      color: rgba(255,255,255,0.72);
      font-size: 14px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 600;
      font-size: 14px;
      color: rgba(255,255,255,0.9);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      color: #ffffff;
      background: rgba(20, 24, 28, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    input::placeholder { color: rgba(255,255,255,0.52); }
    input:focus {
      border-color: rgba(255,255,255,0.65);
      background: rgba(20,24,28,0.3);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 10px;
      background: rgba(17,24,39,0.72);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    button:hover { background: rgba(17,24,39,0.88); }

    .message {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(209,250,229,0.16);
      border: 1px solid rgba(209,250,229,0.24);
      color: #ecfdf5;
      font-size: 14px;
    }

    .hint {
      margin-top: 16px;
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Entrar</h1>
    <p>Tela simples de login para teste visual.</p>

    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="seuemail@exemplo.com" required />

      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="Digite sua senha" required />

      <button type="submit">Entrar</button>
    </form>

    <div id="message" class="message">
      Login de demonstração enviado com sucesso.
    </div>

    <div class="hint">Demonstração — não envia dados para servidor.</div>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("message").style.display = "block";
    });
  </script>
</body>
</html>
