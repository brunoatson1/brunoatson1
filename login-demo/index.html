<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }
    .login-card {
      width: min(92vw, 380px);
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 22px; color: #6b7280; font-size: 14px; }
    label { display: block; margin: 14px 0 7px; font-weight: 600; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #111827; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { opacity: 0.92; }
    .message {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #ecfdf5;
      color: #065f46;
      font-size: 14px;
    }
    .hint {
      margin-top: 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Entrar</h1>
    <p>Tela simples de login para teste visual.</p>

    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" placeholder="seuemail@exemplo.com" required />

      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="Digite sua senha" required />

      <button type="submit">Entrar</button>
    </form>

    <div id="message" class="message">
      Login de demonstração enviado com sucesso.
    </div>

    <div class="hint">Demonstração — não envia dados para servidor.</div>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("message").style.display = "block";
    });
  </script>
</body>
</html>
